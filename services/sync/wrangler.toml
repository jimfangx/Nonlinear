name = "nonlinear-sync"
main = "src/worker.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "nonlinear"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Comma-separated origins allowed to start OAuth / receive redirects and call the API.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173,tauri://localhost"
GITHUB_CLIENT_ID = "REPLACE_WITH_OAUTH_APP_CLIENT_ID"

# Secrets (set with `wrangler secret put`):
#   GITHUB_CLIENT_SECRET  — OAuth App client secret (never shipped in the app)
#   TOKEN_KEY             — base64 32-byte key encrypting stored GitHub tokens
