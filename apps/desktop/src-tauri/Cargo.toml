[package]
name = "nonlinear-desktop"
version = "0.1.16"
edition = "2021"
description = "Nonlinear desktop shell: Tauri 2 + Rust core (git, SQLite, keychain, SSH helper)"
license = "MIT"

[lib]
name = "nonlinear_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
ureq = { version = "2", features = ["json"] }
wait-timeout = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
